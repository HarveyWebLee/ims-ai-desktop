# platform-contracts — Agent / MCP 共享运行时契约（无 LangChain / FastMCP / LangGraph）
#
# 目录：services/platform-contracts
# 包名（import）：contracts
# 职责：HITL 载荷、preflight、catalog 读取、平台 HTTP 客户端、告警/设备纯函数等
# 执行面（@tool handler）仍在 platform-mcp-server

[project]
name = "contracts"
version = "0.1.0"
description = "综合信息平台 AI 智能化共享运行时契约（Agent + Platform MCP）"
requires-python = "==3.14.4"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "basedpyright>=1.28.0",
    "pytest>=8.0.0",
]

[project.scripts]
# 代码质量：uv run check format|lint|typecheck|test|fix|gate|all
# pre-commit / pnpm check 使用 gate（不含 pytest）；all = gate + test
check = "contracts.quality:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["contracts", "tests"]
exclude = [
    ".venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["contracts"]

[tool.pyright]
include = ["contracts", "tests"]
exclude = ["**/__pycache__", ".venv", ".ruff_cache", ".pytest_cache"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
