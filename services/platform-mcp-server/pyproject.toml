# platform-mcp-server — 平台工具 MCP Server（v2）
#
# 端口默认 8010，Streamable HTTP：http://127.0.0.1:8010/mcp
# 工具执行面：platform_mcp.runtime（不再依赖 Agent 包实现）

[project]
name = "platform-mcp-server"
version = "0.3.0"
description = "综合信息平台业务工具 MCP Server"
requires-python = "==3.14.4"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    # 工具 @tool（无 langgraph；HITL 仅 hitl_required JSON）
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "basedpyright>=1.28.0",
]

[project.scripts]
mcp = "platform_mcp.dev:main"
platform-mcp = "platform_mcp.dev:main"
mcp-check = "platform_mcp.quality:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_mcp"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["platform_mcp", "scripts"]
exclude = [
    ".venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["platform_mcp"]

[tool.pyright]
include = ["platform_mcp", "scripts"]
exclude = ["**/__pycache__", ".venv", ".ruff_cache", ".pytest_cache"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
